name: Sampled solid inspection viewer
on:
  pull_request:
    paths:
      - 'projects/korosuke/inspection-viewer/**'
      - 'projects/korosuke/inspection-evidence/**'
      - '.github/workflows/korosuke-inspection.yml'
permissions:
  contents: read
jobs:
  solids:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends freecad-python3 git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Regressions and neutral export
        env:
          PYTHONPATH: /usr/lib/freecad/lib:/usr/lib/freecad-python3/lib
        run: |
          mkdir -p inspection-results
          /usr/bin/python3 -m unittest discover -s projects/korosuke/generic-solids -v > inspection-results/solids.log 2>&1
          /usr/bin/python3 projects/korosuke/generic-solids/run_analytic.py inspection-results/analytic
          /usr/bin/python3 -m unittest discover -s projects/korosuke/generic-kinematics -v > inspection-results/kinematics.log 2>&1
          /usr/bin/python3 projects/korosuke/inspection-evidence/export_neutral.py inspection-results/neutral
      - name: Bind solid evidence
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p inspection-results
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD HEAD^{tree} > inspection-results/identity.txt
          sha256sum .github/workflows/korosuke-inspection.yml > inspection-results/workflow.sha256
          find inspection-results -type f ! -name SHA256SUMS -exec sha256sum {} + > inspection-results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-solids-${{ github.event.pull_request.head.sha }}
          path: inspection-results/
  browser:
    needs: solids
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: inspection-solids-${{ github.event.pull_request.head.sha }}
          path: inspection-results
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test projects/korosuke/inspection-viewer/model.test.mjs
      - name: Browser matrix
        env:
          VIEWER_INPUT: ${{ github.workspace }}/inspection-results/neutral/viewer.json
          VIEWER_EVIDENCE: ${{ github.workspace }}/inspection-browser
        run: node projects/korosuke/inspection-viewer/browser-check.cjs
      - name: Evidence identity
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p inspection-browser
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} > inspection-browser/identity.txt
          sha256sum .github/workflows/korosuke-inspection.yml > inspection-browser/workflow.sha256
          find inspection-browser -type f ! -name SHA256SUMS -exec sha256sum {} + > inspection-browser/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-browser-${{ github.event.pull_request.head.sha }}
          path: inspection-browser/
