name: Generic joint clearance (public fixtures only)

on:
  pull_request:
    paths:
      - "projects/korosuke/generic-kinematics/**"
      - ".github/workflows/korosuke-generic-clearance.yml"
  push:
    branches: [main]
    paths:
      - "projects/korosuke/generic-kinematics/**"
      - ".github/workflows/korosuke-generic-clearance.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run neutral rectangle screening tests
        run: python -m unittest discover -s projects/korosuke/generic-kinematics -v
      - name: Run neutral example
        run: python projects/korosuke/generic-kinematics/sweep.py projects/korosuke/generic-kinematics/example-neutral.json
  numerical-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional independent oracle only
        run: python -m pip install mpmath==1.3.0
      - name: Run immutable red-green and boundary evidence
        run: python projects/korosuke/generic-kinematics/numeric-validation/run.py --output numeric-results
      - name: Run independently authored numerical oracle
        run: python projects/korosuke/generic-kinematics/numeric-validation/independent/independent_numeric_checks.py --source-dir projects/korosuke/generic-kinematics --output numeric-results/independent-results.json
      - name: Bind final evidence to exact HEAD and attempt
        if: always()
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          p=pathlib.Path('numeric-results');p.mkdir(exist_ok=True)
          record={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'workflow_sha256':hashlib.sha256(pathlib.Path('.github/workflows/korosuke-generic-clearance.yml').read_bytes()).hexdigest(),'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          (p/'ci-identity.json').write_text(json.dumps(record,indent=2)+'\n')
          m={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.iterdir()) if f.is_file() and f.name!='SHA256SUMS.json'}
          (p/'SHA256SUMS.json').write_text(json.dumps(m,indent=2)+'\n')
          PYCODE
      - name: Upload numerical original logs and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: numeric-results/
          if-no-files-found: error
